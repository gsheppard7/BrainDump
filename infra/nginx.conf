# Query strings (search terms) are deliberately excluded from access logs.
log_format braindump '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log braindump;

    root /usr/share/nginx/html;

    # Slightly above the API limit so the API returns its own, friendlier 413.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
