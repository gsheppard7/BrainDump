name: braindump

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-braindump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-braindump}
      POSTGRES_DB: ${POSTGRES_DB:-braindump}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-braindump}:${POSTGRES_PASSWORD:-braindump}@db:5432/${POSTGRES_DB:-braindump}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Same directory the API uses when run locally with `uv run`, so both modes share files.
      - ./apps/api/data:/data

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
